[project]
name = "nlqk"
version = "0.0.2"
authors = [
  { name="Damir Cavar", email="dcavar@acm.org",},
  { name="Koushik Reddy Parukola", email="@iu.edu",},
  { name="Shane A. Sparks", email="@iu.edu",},
  { name="James B. Graves", email="@iu.edu",},
]
description-file="README_pypi.rst"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.3.1",
]
[project.urls]
Homepage = "https://nlqk.ai/"
Issues = "https://github.com/dcavar/nlqk/issues"